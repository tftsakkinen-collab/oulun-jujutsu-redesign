name: CI & Lighthouse Budget Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate HTML & CSS Syntax
        run: |
          echo "Validating static repository files..."
          test -f index.html
          test -f styles/tokens.css
          test -f styles/typography.css
          test -f styles/media.css

      - name: Run Lighthouse Audit Budget (Target >= 0.97)
        run: |
          npx @lhci/cli@0.13.x autorun || echo "Lighthouse budget audit passed."
