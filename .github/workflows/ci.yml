name: CI & Link/Form Health Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify All Links, Forms & APIs
        run: node scripts/verify-all-links.mjs

      - name: Validate Core Files
        run: |
          test -f index.html
          test -f peruskurssi.html
          test -f styles/tokens.css
          test -f styles/typography.css
          test -f styles/media.css
